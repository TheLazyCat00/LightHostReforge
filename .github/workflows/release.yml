name: Build and release

on:
  pull_request:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            platform: windows
            triplet: x64-windows-static
            artifact: LightHostReforge-windows-x64
          - name: macOS Apple Silicon
            os: macos-latest
            platform: macos
            triplet: arm64-osx
            artifact: LightHostReforge-macos-arm64
          - name: macOS Intel
            os: macos-15-intel
            platform: macos
            triplet: x64-osx
            artifact: LightHostReforge-macos-x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install dependencies (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install juce:${{ matrix.triplet }} asiosdk:${{ matrix.triplet }}

      - name: Install dependencies (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          "$VCPKG_INSTALLATION_ROOT/vcpkg" install juce:${{ matrix.triplet }}

      - name: Configure
        shell: bash
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel

      - name: Package Windows build
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive `
            -Path "build/LightHost_artefacts/Release/Light Host.exe" `
            -DestinationPath "dist/${{ matrix.artifact }}.zip"

      - name: Package macOS build
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            "build/LightHost_artefacts/Release/Light Host.app" \
            "dist/${{ matrix.artifact }}.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.zip
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release and upload binaries
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi

          gh release upload "$TAG" dist/*.zip --clobber
